name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-health:
    name: Repository health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate core files
        shell: bash
        run: |
          test -f README.md
          find . -maxdepth 3 -type f | sort | head -200

      - name: Lightweight secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(AWS_SECRET_ACCESS_KEY|PRIVATE KEY|api[_-]?key\s*=|token\s*=|password\s*=)' . --exclude-dir=.git --exclude='*.md'; then
            echo 'Potential secret-like values found. Review required.'
            exit 1
          fi

  python-quality:
    name: Python quality and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install tooling and project dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          if [ -f pyproject.toml ]; then pip install -e . || true; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Run pytest if tests exist
        shell: bash
        run: |
          if [ -d tests ]; then pytest tests -v --tb=short; else echo 'No tests directory found; skipping pytest.'; fi

  docker-smoke:
    name: Docker smoke build
    runs-on: ubuntu-latest
    if: ${{ hashFiles('Dockerfile') != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t repo-smoke:${{ github.sha }} .
